<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Airline Management System</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .topbar {
            background: #003366;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            height: 60px;
        }

        .topbar-logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .topbar nav a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .topbar nav a:hover {
            background: rgba(255,255,255,0.12);
            color: white;
        }

        .topbar nav a:visited {
            color: rgba(255,255,255,0.55);
        }

        .topbar nav {
            display: flex;
            gap: 4px;
        }

        /* Dropdown */
        .dropdown {
            position: relative;
        }

        .dropdown-toggle {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-toggle:hover {
            background: rgba(255,255,255,0.2);
        }

        .dropdown-arrow {
            font-size: 10px;
            transition: transform 0.2s;
        }

        .dropdown.open .dropdown-arrow {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 180px;
            z-index: 1000;
            overflow: hidden;
        }

        .dropdown.open .dropdown-menu {
            display: block;
        }

        .dropdown-menu a,
        .dropdown-menu button {
            display: block;
            width: 100%;
            padding: 10px 16px;
            text-align: left;
            color: #333;
            text-decoration: none;
            font-size: 14px;
            background: none;
            border: none;
            cursor: pointer;
            box-sizing: border-box;
        }

        .dropdown-menu a:hover,
        .dropdown-menu button:hover {
            background: #f0f4ff;
            color: #003366;
        }

        .dropdown-menu .divider {
            height: 1px;
            background: #eee;
            margin: 4px 0;
        }

        .dropdown-menu .logout-btn {
            color: #cc0000;
        }

        .dropdown-menu .logout-btn:hover {
            background: #fff0f0;
        }

        .user-avatar {
            width: 26px;
            height: 26px;
            background: #0055aa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="topbar">
    <a class="topbar-logo" href="/">✈ Airline System</a>

    <div class="topbar-right">
        <nav id="mainNav">
            <a href="/">Home</a>
            <a href="/pages/flights.html">Flights</a>
            <a href="/pages/reservations.html">Reservations</a>
            <a href="/pages/reservations-list.html" id="reservationsListMenu">Reservations List</a>
            <a href="/pages/seats.html" id="seatsMenu">Seats</a>
            <a href="/pages/users.html" id="usersMenu">Users</a>
        </nav>

        <div class="dropdown" id="userDropdown">
            <button class="dropdown-toggle" onclick="toggleDropdown()">
                <div class="user-avatar" id="userAvatar"></div>
                <span id="userNameDisplay"></span>
                <span class="dropdown-arrow">▼</span>
            </button>
            <div class="dropdown-menu">
                <a href="/pages/profile.html">👤 My Profile</a>
                <div class="divider"></div>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </div>
    </div>
</div>

<div class="container" style="margin-top: 30px;">
    <div class="card">
        <h1>Welcome</h1>
        <p>Airline Reservation Platform</p>
    </div>
</div>

<script>
    const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));

    if (!loggedUser) {
        window.location.href = "/pages/login.html";
    }

    const fullName = ((loggedUser.firstName || '') + ' ' + (loggedUser.lastName || '')).trim();
    document.getElementById("userNameDisplay").textContent = fullName || loggedUser.username;
    document.getElementById("userAvatar").textContent =
        (loggedUser.firstName?.[0] || loggedUser.username?.[0] || '?').toUpperCase();

    if (loggedUser.role !== 'SYSTEM_ADMIN') {
        document.getElementById("usersMenu").style.display = "none";
        document.getElementById("reservationsListMenu").style.display = "none";
        document.getElementById("seatsMenu").style.display = "none";
    }

    function toggleDropdown() {
        document.getElementById("userDropdown").classList.toggle("open");
    }

    document.addEventListener("click", function(e) {
        const dropdown = document.getElementById("userDropdown");
        if (!dropdown.contains(e.target)) {
            dropdown.classList.remove("open");
        }
    });

    function logout() {
        localStorage.removeItem("loggedUser");
        window.location.href = "/pages/login.html";
    }
</script>

</body>
</html>
