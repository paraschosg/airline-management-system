<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<header>
    <h2>Airline Reservation System</h2>
</header>

<div class="container">

    <div class="card">

        <h2>Login</h2>

        <label>Username</label>

        <input
                type="text"
                id="username"
        >

        <label>Password</label>

        <input
                type="password"
                id="password"
        >

        <br><br>

        <button onclick="login()">
            Login
        </button>

        <p id="message"></p>

    </div>

</div>

<script src="/js/login.js"></script>

</body>
</html>
