<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>My Profile</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<header>

    <h2>My Profile</h2>

</header>

<div class="container">

    <div class="card">

        <h3>Profile Information</h3>

        <input
                type="text"
                id="firstName"
                placeholder="First Name">

        <br><br>

        <input
                type="text"
                id="lastName"
                placeholder="Last Name">

        <br><br>

        <input
                type="email"
                id="email"
                placeholder="Email">

        <br><br>

        <input
                type="text"
                id="address"
                placeholder="Address">

        <br><br>

        <input
                type="text"
                id="afm"
                placeholder="AFM">

        <br><br>

        <input
                type="text"
                id="identityNumber"
                placeholder="Identity Number">

        <br><br>

        <button onclick="updateProfile()">

            Save Changes

        </button>

    </div>

</div>

<script src="/js/profile.js"></script>

</body>

</html>
