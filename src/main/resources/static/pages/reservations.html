<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>Reservations</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<header>
    <h2>Airline Reservation System</h2>
</header>

<nav class="navbar">

    <div class="logo">
        Airline System
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/pages/flights.html">
            Flights
        </a>

        <a href="/pages/reservations.html">
            Reservations
        </a>

        <a href="/pages/seats.html">
            Seats
        </a>

    </div>

</nav>

<div class="container">

    <div class="card">

        <h2>Create Reservation</h2>

        <label>User ID</label>

        <input
                type="number"
                id="userId"
                required
        >

        <label>Select Flight</label>

        <select
                id="flightId"
                onchange="loadSeats()"
        ></select>

        <label>Reservation Type</label>

        <select
                id="type"
                onchange="loadSeats()"
        >

            <option value="BUSINESS">
                BUSINESS
            </option>

            <option value="NORMAL">
                NORMAL
            </option>

            <option value="ECONOMY">
                ECONOMY
            </option>

        </select>

        <br><br>

        <h2>Available Seats</h2>

        <button
                type="button"
                onclick="loadSeats()">

            Load Seats

        </button>

        <div
                id="seatsContainer"
                style="
                    display:flex;
                    flex-wrap:wrap;
                    gap:10px;
                    margin-top:20px;
                ">
        </div>

        <input type="hidden" id="selectedRow">
        <input type="hidden" id="selectedColumn">

        <br><br>

        <button onclick="createReservation()">
            Create Reservation
        </button>

        <p id="message"></p>

    </div>

</div>

<script src="/js/reservations.js"></script>

</body>
</html>
